<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Realm-to-realm transition (Top 5 Realms "case file" theme): pixel blocks sweep in diagonally, fully cover the
         frame at 0.40 s (the cut sits there), then sweep out the far side. Transparent overlay, 0.8 s. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .t { position: absolute; width: 122px; height: 122px; transform: scale(0); }
      #streak { position: absolute; left: -400px; top: 0; width: 260px; height: 1080px; opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-fps="60" data-start="0" data-duration="0.8" data-width="1920" data-height="1080">
      <div id="tiles" class="clip" data-start="0" data-duration="0.8" data-track-index="1" style="position:absolute;inset:0"></div>
      <div id="streak"></div>
      <audio id="whoosh" src="assets/whoosh-short.mp3" data-start="0.12" data-duration="0.57" data-track-index="2" data-volume="0.22"></audio>
    </div>
    <script>
      const COLS = 16, ROWS = 9, SZ = 120, root = document.getElementById("tiles");
      const COLORS = ["#b48cff", "#9a6bf2", "#7d4fe0", "#2a1550", "#1d1430"];
      const tiles = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const d = document.createElement("div"); d.className = "t";
        d.style.left = c * SZ - 1 + "px"; d.style.top = r * SZ - 1 + "px";
        d.style.background = COLORS[((c * 37 + r * 61) * 2654435761 >>> 0) % COLORS.length];
        if (((c * 92821 + r * 68917) % 97) < 5) d.style.background = "#ffc93a";   // a few scattered gold specks
        root.appendChild(d); tiles.push([d, c, r]);
      }
      const tl = gsap.timeline({ paused: true });
      const diag = (c, r) => (c + r) / (COLS + ROWS - 2);                  // 0 top-left .. 1 bottom-right
      tiles.forEach(([d, c, r]) => {
        tl.to(d, { scale: 1, duration: 0.12, ease: "power2.out" }, 0.02 + diag(c, r) * 0.24);
        tl.to(d, { scale: 0, duration: 0.12, ease: "power2.in" }, 0.42 + diag(c, r) * 0.24);
      });
      tl.fromTo("#streak", { x: 0, opacity: 0 }, { x: 2600, opacity: 1, duration: 0.5, ease: "power1.inOut" }, 0.15);
      tl.set("#streak", { opacity: 0 }, 0.66);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
