      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }

    <script>
      // ---------- deterministic helpers ----------
      function rng(seed) {
        let a = seed >>> 0;
