      const stamp = (sel, t, rot) => tl.fromTo(sel, { scale: 2.6, opacity: 0, rotation: rot - 8 }, { scale: 1, opacity: 0.95, rotation: rot, duration: 0.16, ease: "power4.in" }, t);
      const shake = (t, amp = 14, n = 6) => {
        for (let i = 0; i < n; i++) tl.to("#shake", { x: (i % 2 ? -1 : 1) * amp * (1 - i / n), y: ((i % 3) - 1) * amp * 0.6 * (1 - i / n), duration: 0.035, ease: "none" }, t + i * 0.035);
        tl.to("#shake", { x: 0, y: 0, duration: 0.05 }, t + n * 0.035);
      };
      const glitch = (el, t0) => {
        tl.set(el, { background: "linear-gradient(180deg, rgba(180,60,255,.38) 0 18%, transparent 18% 40%, rgba(0,220,255,.35) 40% 52%, transparent 52% 78%, rgba(255,255,255,.25) 78% 84%, transparent 84%)" }, t0);
        [0, 0.07, 0.14, 0.21, 0.28].forEach((d, i) => tl.set(el, { y: [0, -80, 60, -30, 120][i], opacity: [1, 0.6, 1, 0.4, 0][i] }, t0 + d));
      };

      // global: dot drift, flashlight wander, grain jitter
      tl.fromTo("#dots-el", { x: 0, y: 0 }, { x: -48, y: -192, duration: 27.6, ease: "none" }, 0);
      tl.fromTo("#spot-el", { x: -420, y: -120 }, { x: 380, y: 90, duration: 9, ease: "sine.inOut" }, 0);
      tl.to("#spot-el", { x: -260, y: 160, duration: 9, ease: "sine.inOut" }, 9);
      tl.to("#spot-el", { x: 0, y: -60, duration: 9.6, ease: "sine.inOut" }, 18);
      { const r = rng(5); for (let i = 0; i < 27.6 * 12; i++) tl.set("#grain-el", { x: -((r() * 128) | 0), y: -((r() * 128) | 0) }, i / 12); }

      // A: realms + heartbeat
      pop("#kw-mc", 0.02, 1.8);
      pop("#kw-realms", 0.64, 1.9, 0.32);
      tl.fromTo("#a-mon", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.fromTo("#a-ecg-wrap", { width: 0 }, { width: 1680, duration: ECG_T1 - ECG_T0, ease: "none" }, ECG_T0);
      tl.fromTo("#a-cur", { x: 0 }, { x: 1680, duration: ECG_T1 - ECG_T0, ease: "none" }, ECG_T0);
      [1.44, 2.0].forEach((t) => { tl.to("#a-rb", { scale: 1.18, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" }, t);
        tl.set("#a-mon", { borderColor: "#6dffb0" }, t); tl.to("#a-mon", { borderColor: "#2a2140", duration: 0.4 }, t + 0.02); });
      pop("#kw-still", 2.0, 1.8);
      tl.to("#kw-realms", { y: -8, duration: 2, ease: "sine.inOut" }, 1.0);
      // B: glitch cut, players host, SECRET stamp
      glitch("#glitch-el", 3.04);
      [0, 0.07, 0.14, 0.21].forEach((d, i) => tl.set("#sB-in", { x: [24, -30, 12, 0][i] }, 3.04 + d));
      tl.fromTo("#b-folder", { y: 700, rotation: 4 }, { y: 0, rotation: -1, duration: 0.5, ease: "back.out(1.4)" }, 3.1);
      for (let i = 0; i < HEADS; i++) tl.fromTo("#bh" + i, { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "back.out(2)" }, 3.92 + i * 0.06);
      tl.fromTo("#b-crown", { y: -200, opacity: 1 }, { y: 0, opacity: 1, duration: 0.3, ease: "bounce.out" }, 4.4);
      pop("#kw-host", 4.42, 1.8);
      stamp("#b-stamp", 4.88, -9); shake(5.02, 14);
      pop("#kw-modes", 5.28, 1.6);
      tl.to("#b-folder", { scale: 1.05, duration: 0.8, ease: "power1.out" }, 5.1);
      // C: carousel, card snaps in on each spoken word
      tl.set("#c-track", { rotationY: -14, rotationX: 6 }, 5.96);
      tl.fromTo("#c-track", { x: 1400 }, { x: 0, duration: 0.3, ease: "power3.out" }, 5.96);
      pop("#kw-cat", 6.04, 1.4);
      MODES.forEach((m, i) => {
        const t = m[3], at = Math.max(5.96, t - 0.16);
        if (i > 0) tl.to("#c-track", { x: -i * SPACING, duration: 0.3, ease: "power3.inOut" }, at);
        MODES.forEach((_, j) => tl.to("#mc" + j, { scale: j === i ? 1.08 : 0.82, opacity: j === i ? 1 : 0.45, z: j === i ? 60 : 0, duration: 0.3, ease: "power3.out" }, at));
        tl.to("#mce" + i, { opacity: 1, duration: 0.15 }, t);
        if (i < MODES.length - 1) tl.to("#mce" + i, { opacity: 0, duration: 0.15 }, MODES[i + 1][3] - 0.16);
      });
      tl.to("#c-track", { rotationY: -4, duration: 3.4, ease: "none" }, 6.0);
      pop("#kw-even", 8.56, 1.8);
      tl.to("#mc2", { scale: 1.16, duration: 0.5, ease: "power1.out" }, 8.94);
      // D: limited
      whip("#sD-in", 9.44);
      tl.fromTo("#d-block", { rotation: -4, y: 20 }, { rotation: 3, y: -10, duration: 1.96, ease: "sine.inOut" }, 9.44);
      pop("#kw-realmsrv", 9.6, 1.5);
      tl.fromTo("#d-wall-l", { x: 0 }, { x: 500, duration: 0.22, ease: "power3.in" }, 9.86);
      tl.fromTo("#d-wall-r", { x: 0 }, { x: -500, duration: 0.22, ease: "power3.in" }, 9.86);
      tl.to("#d-block", { scale: 0.74, duration: 0.25, ease: "back.out(2)" }, 10.06);
      tl.fromTo("#d-tape1", { x: -3600 }, { x: -700, duration: 0.3, ease: "power3.out" }, 10.0);
      tl.fromTo("#d-tape2", { x: 1920 }, { x: -900, duration: 0.3, ease: "power3.out" }, 10.1);
      pop("#kw-limited", 10.0, 2.4, 0.3); shake(10.08, 14);
      tl.to(["#d-tape1", "#d-tape2"], { x: "-=120", duration: 1.0, ease: "none" }, 10.4);
      // E: ten players
      whip("#sE-in", 11.4);
      pop("#kw-max", 11.5, 1.6);
      for (let i = 0; i < 10; i++) tl.fromTo("#eh" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2.6)" }, 11.92 + i * 0.08);
      const pc = { v: 0 };
      tl.fromTo(pc, { v: 0 }, { v: 10, duration: 0.72, ease: "none", onUpdate: () => { $("e-num").textContent = Math.round(pc.v) + "/10"; } }, 11.92);
      tl.to("#e-count", { scale: 1.14, duration: 0.08, yoyo: true, repeat: 1 }, 12.64);
      stamp("#e-full", 12.96, 8); shake(13.1, 9);
      tl.fromTo("#eh10", { x: 500, opacity: 1 }, { x: 0, opacity: 1, duration: 0.14, ease: "power2.out" }, 12.98);
      tl.to("#eh10", { x: 420, rotation: 40, opacity: 0, duration: 0.25, ease: "power2.in" }, 13.14);
      tl.fromTo("#e-x", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.12 }, 13.12);
      out("#e-x", 13.28, 0.1);
      // F: detective board
      whip("#sF-in", 13.4);
      tl.fromTo("#f-board", { scale: 1 }, { scale: 1.08, duration: 4.5, ease: "none" }, 13.4);
      POLS.forEach((_, i) => tl.fromTo("#pl" + i, { y: -700 }, { y: 0, duration: 0.3, ease: "back.out(1.4)" }, 13.42 + i * 0.05));
      [0, 1, 2].forEach((i) => { const l = $("fs" + i); tl.fromTo(l, { attr: { "stroke-dashoffset": l.dataset.len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power1.inOut" }, 13.8 + i * 0.15); });
      [0, 1, 2].forEach((i) => pop("#fq" + i, 14.08 + i * 0.06, 2));
      tl.fromTo("#f-mag", { x: 1650, y: 760 }, { x: 330, y: 160, duration: 1.0, ease: "power2.inOut" }, 13.6);
      tl.to("#f-mag", { x: 880, y: 110, duration: 0.9, ease: "power1.inOut" }, 14.7);
      tl.to("#f-mag", { x: 1420, y: 200, duration: 0.9, ease: "power1.inOut" }, 15.6);
      tl.to("#f-mag", { x: 1500, y: 470, scale: 1.25, duration: 1.2, ease: "power1.inOut" }, 16.5);
      pop("#kw-going", 14.64, 1.6);
      out("#kw-going", 16.38, 0.12);
      pop("#kw-bedrock", 16.48, 1.8);
      pop("#kw-realms2", 17.52, 2.0, 0.26);
      tl.to("#sF-in", { filter: "brightness(0.6)", duration: 1.2, ease: "power1.in" }, 16.7);
      // G: DROP — case file
      tl.fromTo("#g-type", { width: 0 }, { width: 1400, duration: 0.7, ease: "steps(25)" }, 18.22);
      for (let i = 0; i < 5; i++) tl.fromTo("#gc" + i, { y: 800, rotation: (i - 2) * 10 }, { y: Math.abs(i - 2) * 22, rotation: (i - 2) * 3, duration: 0.42, ease: "back.out(1.5)" }, 18.4 + i * 0.07);
      stamp("#g-stamp", 19.68, -5); shake(19.8, 16);
      tl.fromTo("#g-mag", { x: 160, y: 300, opacity: 0 }, { x: 260, y: 300, opacity: 1, duration: 0.2 }, 19.95);
      tl.to("#g-mag", { x: 1500, y: 280, duration: 0.8, ease: "power1.inOut" }, 20.16);
      for (let i = 0; i < 5; i++) tl.to("#gc" + i, { y: "-=26", duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 20.1 + i * 0.17);
      // H: progress bar races to the end
      whip("#sH-in", 21.0);
      pop("#kw-watch", 21.06, 1.5);
      tl.fromTo("#h-fill", { width: 0 }, { width: 1200, duration: 1.22, ease: "power1.in" }, 21.1);
      tl.fromTo("#h-dot", { x: 0 }, { x: 1200, duration: 1.22, ease: "power1.in" }, 21.1);
      const tc = { v: 0 };
      tl.fromTo(tc, { v: 0 }, { v: 900, duration: 1.22, ease: "power1.in", onUpdate: () => { const s = Math.round(tc.v); $("h-time").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " / 15:00"; } }, 21.1);
      out("#kw-watch", 22.1, 0.08);
      pop("#kw-end", 22.16, 2.2, 0.26);
      tl.to("#h-dot", { scale: 1.6, duration: 0.08, yoyo: true, repeat: 1 }, 22.32);
      // I: title slam
      tl.fromTo("#i-top", { scale: 3.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 22.64); shake(22.68, 22, 8);
      tl.fromTo("#i-rays", { rotation: 0, scale: 0.8 }, { rotation: 45, scale: 1.1, duration: 4.96, ease: "none" }, 22.64);
      tl.fromTo("#i-sub", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(2)" }, 22.78);
      pop("#i-trust", 22.96, 1.6);
      tl.fromTo("#i-pill", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3 }, 23.3);
      tl.to("#i-top", { y: -12, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 23.0);
      out("#i-trust", 24.94, 0.1);
      glitch("#glitch2-el", 25.04);
      pop("#i-shock", 25.04, 2.4, 0.3); shake(25.06, 20, 8);
      tl.fromTo("#i-shock", { rotation: -3 }, { rotation: 2, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 25.36);
      // flashes / fades
      tl.fromTo("#flash1-el", { opacity: 0.95 }, { opacity: 0, duration: 0.38, ease: "power2.out" }, 18.16);
      tl.fromTo("#flash2-el", { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power2.out" }, 22.64);
      tl.fromTo("#endfade-el", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.in" }, 27.02);

      // scenes holding gameplay <video>s can't be timed elements themselves, so the timeline shows/hides them
      tl.set("#sC", { visibility: "visible" }, 5.96); tl.set("#sC", { visibility: "hidden" }, 9.44);
      tl.set("#sF", { visibility: "visible" }, 13.4); tl.set("#sF", { visibility: "hidden" }, 17.9);
      tl.set("#sH", { visibility: "visible" }, 21.0); tl.set("#sH", { visibility: "hidden" }, 22.64);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
